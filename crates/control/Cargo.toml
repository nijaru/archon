[package]
name = "archon-control"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Archon persistent control plane: command log, admission, Cluster"

[dependencies]
archon-kernel = { path = "../kernel", features = ["serde"] }
archon-node = { path = "../node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
