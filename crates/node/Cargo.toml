[package]
name = "archon-node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Archon node agent: discovery, execution, cgroup/device enforcement"

[dependencies]
archon-kernel = { path = "../kernel", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = "0.10"

[lib]
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
