[package]
name = "archon-node"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
archon-kernel = { path = "../kernel", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"

[lib]
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
