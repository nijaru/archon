[package]
name = "archon-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Archon control plane, node agent, and client in one binary"

[dependencies]
archon-kernel = { path = "../kernel" }
archon-node = { path = "../node" }
archon-control = { path = "../control" }
serde_json = "1"

[[bin]]
name = "archon"
path = "src/main.rs"
