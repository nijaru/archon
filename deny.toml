[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Apache-2.0 workspace (see LICENSE). Workspace crates are unpublished,
# so license checks skip them.
[licenses]
version = 2
confidence-threshold = 0.0
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
