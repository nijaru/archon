name: Admission decision trace

on:
  push:
    branches:
      - tmp/admission-decision-trace

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply admission trace patch
        run: python3 .github/scripts/patch_admission_trace.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test -p archon-kernel --test admission_trace -- --nocapture
      - run: cargo test -p archon-kernel --test fair_share
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p archon-sim
      - run: cargo deny check advisories bans licenses sources
      - name: Publish validated source tree
        run: |
          rm .github/scripts/patch_admission_trace.py
          rm .github/workflows/admission-decision-trace.yml
          git add -A
          git config user.name "Nick"
          git config user.email "nijaru7@gmail.com"
          git commit -m "feat(kernel): add admission decision traces"
          git push origin HEAD:tmp/admission-decision-trace
