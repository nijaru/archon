name: Validate health observation separation

on:
  push:
    branches: [tmp/health-observation-separation-v2]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply observation split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_line(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}")
              file.write_text(text.replace(old, new, 1))

          graph = Path("crates/kernel/src/graph.rs")
          text = graph.read_text()
          text = text.replace(
              "    CapacityDimension, ClaimBinding, ClaimBindingUpdate, Edge, EdgeKind, Node, Quantity,\n",
              "    Attrs, CapacityDimension, ClaimBinding, ClaimBindingUpdate, Edge, EdgeKind, Node, Quantity,\n",
              1,
          )
          marker = "    claim_bindings: BTreeMap<NodeId, BTreeMap<CapacityDimension, ClaimBinding>>,\n"
          if text.count(marker) != 1:
              raise SystemExit("graph claim_bindings marker changed")
          text = text.replace(
              marker,
              marker
              + "    /// Non-authoritative observations used for scoring and diagnostics.\n"
              + "    /// They never participate in `revision`, hard filters, Claims, or authority.\n"
              + "    #[cfg_attr(\n"
              + "        feature = \"serde\",\n"
              + "        serde(default, skip_serializing_if = \"BTreeMap::is_empty\")\n"
              + "    )]\n"
              + "    observations: BTreeMap<NodeId, Attrs>,\n",
              1,
          )
          line = "        staged_nodes.insert(node.id, node);\n"
          if text.count(line) != 1:
              raise SystemExit("staged node insert marker changed")
          text = text.replace(
              line,
              "        if node.attrs.contains_key(\"health\") {\n"
              + "            return Err(Error::Refused {\n"
              + "                explanation: format!(\n"
              + "                    \"resource fact {} uses reserved observation key health\",\n"
              + "                    node.id\n"
              + "                ),\n"
              + "            });\n"
              + "        }\n"
              + line,
              1,
          )
          start = text.index("    /// Set one node attribute without advancing `Graph.revision`.")
          end = text.index("\n\n    pub fn node(&self", start)
          text = text[:start] + '''    pub fn observation(&self, id: NodeId, key: &str) -> Option<&str> {
              self.observations
                  .get(&id)
                  .and_then(|attrs| attrs.get(key))
                  .map(String::as_str)
          }

          pub fn observations(&self) -> &BTreeMap<NodeId, Attrs> {
              &self.observations
          }

          pub(crate) fn set_observation(&mut self, id: NodeId, key: &str, value: String) -> bool {
              if !self.nodes.contains_key(&id) {
                  return false;
              }
              self.observations
                  .entry(id)
                  .or_default()
                  .insert(key.to_string(), value);
              true
          }

          /// Upgrade snapshots written before observations were separated from
          /// hard resource facts. A dedicated observation wins if both forms exist.
          pub(crate) fn migrate_legacy_observations(&mut self) {
              let legacy: Vec<_> = self
                  .nodes
                  .iter_mut()
                  .filter_map(|(id, node)| node.attrs.remove("health").map(|health| (*id, health)))
                  .collect();
              for (id, health) in legacy {
                  self.observations
                      .entry(id)
                      .or_default()
                      .entry("health".into())
                      .or_insert(health);
              }
          }''' + text[end:]
          start = text.index("        let degraded = |node: NodeId| {")
          end = text.index("        };", start) + len("        };")
          text = text[:start] + '        let degraded = |node: NodeId| self.observation(node, "health") == Some("degraded");' + text[end:]
          graph.write_text(text)

          cluster = Path("crates/kernel/src/cluster.rs")
          text = cluster.read_text()
          marker = "        BTreeMap<NodeId, BTreeMap<crate::types::CapacityDimension, ClaimBinding>>,\n"
          if text.count(marker) != 1:
              raise SystemExit("Digest claim binding marker changed")
          text = text.replace(
              marker,
              marker + "    pub graph_observations: BTreeMap<NodeId, crate::types::Attrs>,\n",
              1,
          )
          marker = "            graph_claim_bindings: self.graph.claim_bindings().clone(),\n"
          if text.count(marker) != 1:
              raise SystemExit("digest builder claim binding marker changed")
          text = text.replace(
              marker,
              marker + "            graph_observations: self.graph.observations().clone(),\n",
              1,
          )
          start = text.index("    /// Health is scoring input, not authoritative ownership state")
          end = text.index("\n\n    fn set_agent_session", start)
          text = text[:start] + '''    /// Health is an observation used for scoring and diagnostics, not a
          /// resource fact or ownership state. It never advances Graph.revision.
          fn set_node_health(&mut self, node: NodeId, health: String) -> Result<Vec<Effect>, Error> {
              self.graph
                  .set_observation(node, "health", health)
                  .then_some(Vec::new())
                  .ok_or(Error::UnknownNode(node))
          }

          /// Normalize persisted state from snapshots written before observations
          /// were separated from revisioned Node attributes.
          pub fn migrate_legacy_observations(&mut self) {
              self.graph.migrate_legacy_observations();
          }''' + text[end:]
          cluster.write_text(text)

          service = Path("crates/node/src/service.rs")
          text = service.read_text()
          start = text.index("    pub fn restore(&mut self, cluster: archon_kernel::Cluster, state: ServiceState) {")
          end = text.index("\n    }", start) + len("\n    }")
          text = text[:start] + '''    pub fn restore(&mut self, mut cluster: archon_kernel::Cluster, state: ServiceState) {
              cluster.migrate_legacy_observations();
              self.cluster = cluster;
              self.pending.clear();
              self.restore_state(state);
          }''' + text[end:]
          service.write_text(text)

          Path("crates/kernel/tests/observations.rs").write_text(r'''use archon_kernel::{
              BindingScope, CapacityDimension, ClaimBinding, ClaimBindingUpdate, Cluster, Command,
              Edge, EdgeKind, Filter, Need, Node, NodeId, ProviderId, Quantity, Request, RequestClass,
              RequestId, ResourceClass, qty,
          };

          fn node(id: u64, kind: ResourceClass, capacity: Quantity) -> Node {
              Node {
                  id: NodeId::from_u64(id),
                  kind,
                  attrs: Default::default(),
                  capacity,
              }
          }

          fn cluster() -> Cluster {
              let mut cluster = Cluster::new();
              cluster
                  .apply(Command::ApplyResourceFacts {
                      nodes: vec![
                          node(1, ResourceClass::Machine, Quantity::new()),
                          node(2, ResourceClass::Cpu, qty(CapacityDimension::Count, 1)),
                          node(3, ResourceClass::Cpu, qty(CapacityDimension::Count, 1)),
                      ],
                      edges: vec![
                          Edge {
                              from: NodeId::from_u64(1),
                              to: NodeId::from_u64(2),
                              kind: EdgeKind::Contains,
                              attrs: Default::default(),
                          },
                          Edge {
                              from: NodeId::from_u64(1),
                              to: NodeId::from_u64(3),
                              kind: EdgeKind::Contains,
                              attrs: Default::default(),
                          },
                      ],
                      claim_bindings: [2, 3]
                          .into_iter()
                          .map(|node| ClaimBindingUpdate {
                              node: NodeId::from_u64(node),
                              dimension: CapacityDimension::Count,
                              binding: Some(ClaimBinding {
                                  provider: ProviderId::ENFORCE,
                                  scope: BindingScope::Exclusive,
                              }),
                          })
                          .collect(),
                  })
                  .unwrap();
              cluster
          }

          fn request(filters: Vec<Filter>) -> Request {
              Request {
                  id: RequestId::from_u64(1),
                  class: RequestClass::Batch,
                  needs: vec![Need {
                      kind: ResourceClass::Cpu,
                      quantity: qty(CapacityDimension::Count, 1),
                      filters,
                  }],
                  topology: Vec::new(),
                  preferences: Vec::new(),
                  data: Vec::new(),
                  command: Vec::new(),
                  image: None,
                  storage: Vec::new(),
                  ports: Vec::new(),
                  lifetime: 60,
                  priority: 1,
                  machine_local: true,
                  grace_secs: 0,
                  keep_alive: false,
              }
          }

          #[test]
          fn health_is_non_revisioned_observation_not_a_hard_fact() {
              let mut cluster = cluster();
              let cpu = NodeId::from_u64(2);
              let revision = cluster.graph.revision;
              cluster
                  .apply(Command::SetNodeHealth {
                      node: cpu,
                      health: "degraded".into(),
                  })
                  .unwrap();

              assert_eq!(cluster.graph.revision, revision);
              assert_eq!(cluster.graph.observation(cpu, "health"), Some("degraded"));
              assert!(!cluster.graph.node(cpu).unwrap().attrs.contains_key("health"));

              let error = cluster
                  .allocate(&request(vec![Filter {
                      key: "health".into(),
                      value: "degraded".into(),
                  }]))
                  .expect_err("observations must not satisfy hard resource filters");
              assert!(matches!(error, archon_kernel::Error::Refused { .. }));
          }

          #[test]
          fn degraded_observation_still_changes_scoring() {
              let mut cluster = cluster();
              cluster
                  .apply(Command::SetNodeHealth {
                      node: NodeId::from_u64(2),
                      health: "degraded".into(),
                  })
                  .unwrap();
              let allocation = cluster.allocate(&request(Vec::new())).unwrap();
              assert_eq!(allocation.claims[0].node, NodeId::from_u64(3));
          }

          #[test]
          fn provider_facts_cannot_publish_reserved_health_observation() {
              let mut cluster = Cluster::new();
              let mut machine = node(1, ResourceClass::Machine, Quantity::new());
              machine.attrs.insert("health".into(), "degraded".into());
              let error = cluster
                  .apply(Command::ApplyResourceFacts {
                      nodes: vec![machine],
                      edges: Vec::new(),
                      claim_bindings: Vec::new(),
                  })
                  .expect_err("health is observation state, not a provider-authored fact");
              assert!(error.to_string().contains("reserved observation key health"));
              assert_eq!(cluster.graph.revision, 0);
          }

          #[test]
          fn observation_replay_is_deterministic_without_changing_revision() {
              let mut cluster = cluster();
              let revision = cluster.graph.revision;
              cluster
                  .apply(Command::SetNodeHealth {
                      node: NodeId::from_u64(1),
                      health: "degraded".into(),
                  })
                  .unwrap();
              let replayed = Cluster::replay(&cluster.log).unwrap();
              assert_eq!(cluster.digest(), replayed.digest());
              assert_eq!(replayed.graph.revision, revision);
          }
          ''')

          Path("crates/node/tests/observations.rs").write_text(r'''use archon_kernel::{Cluster, Command, Node, NodeId, Quantity, ResourceClass};
          use archon_node::service::{NodeService, ServiceState};

          #[test]
          fn restore_migrates_legacy_health_attrs_out_of_resource_facts() {
              let mut cluster = Cluster::new();
              cluster
                  .apply(Command::ApplyGraph {
                      nodes: vec![Node {
                          id: NodeId::from_u64(1),
                          kind: ResourceClass::Machine,
                          attrs: Default::default(),
                          capacity: Quantity::new(),
                      }],
                      edges: Vec::new(),
                  })
                  .unwrap();
              let revision = cluster.graph.revision;

              let mut value = serde_json::to_value(&cluster).unwrap();
              let graph = value
                  .get_mut("graph")
                  .and_then(serde_json::Value::as_object_mut)
                  .expect("serialized Graph object");
              graph.remove("observations");
              let nodes = graph
                  .get_mut("nodes")
                  .and_then(serde_json::Value::as_object_mut)
                  .expect("serialized Node map");
              let legacy = nodes.values_mut().next().expect("one serialized Node");
              legacy
                  .get_mut("attrs")
                  .and_then(serde_json::Value::as_object_mut)
                  .expect("serialized Node attrs")
                  .insert(
                      "health".into(),
                      serde_json::Value::String("degraded".into()),
                  );

              let restored: Cluster = serde_json::from_value(value).unwrap();
              assert_eq!(
                  restored
                      .graph
                      .node(NodeId::from_u64(1))
                      .unwrap()
                      .attrs
                      .get("health")
                      .map(String::as_str),
                  Some("degraded"),
                  "fixture must represent the old snapshot layout"
              );

              let mut service = NodeService::new();
              service.restore(restored, ServiceState::default());
              assert_eq!(service.cluster.graph.revision, revision);
              assert_eq!(
                  service
                      .cluster
                      .graph
                      .observation(NodeId::from_u64(1), "health"),
                  Some("degraded")
              );
              assert!(
                  !service
                      .cluster
                      .graph
                      .node(NodeId::from_u64(1))
                      .unwrap()
                      .attrs
                      .contains_key("health")
              );
          }
          ''')
          PY
          cargo fmt --all
      - name: Focused observation tests
        run: |
          cargo test -p archon-kernel --test observations
          cargo test -p archon-node --test observations
          cargo test -p archon-kernel health_updates_do_not_strand_in_flight_allocations
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        shell: bash
        run: |
          rm .github/workflows/validate-health-observations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/validate-health-observations.yml crates/kernel/src/graph.rs crates/kernel/src/cluster.rs crates/node/src/service.rs crates/kernel/tests/observations.rs crates/node/tests/observations.rs
          git commit -m "fix(kernel): separate health observations from resource facts"
          git push
