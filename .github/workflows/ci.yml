name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'fix/topology-neutral-device-reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/topology-neutral-device-reconcile
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply topology-neutral device patch
        run: |
          python3 .github/scripts/topology_neutral_device_reconcile.py
          cargo fmt --all
      - name: Targeted device lifecycle tests
        run: cargo test -p archon-node --test devices
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/topology_neutral_device_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(node): reconcile provider devices across topology"
          git push origin HEAD:fix/topology-neutral-device-reconcile
