name: CI

on:
  push:
    branches: [tmp/claimability-semantic-review]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/claimability-semantic-review
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply semantic reconciliation fix
        run: |
          python3 .github/scripts/fix_claimability_reconcile.py
          cargo fmt --all
      - name: Targeted reconciliation tests
        run: |
          cargo test -p archon-node --test claimability
          cargo test -p archon-node --test devices
          cargo test -p archon-node --test recovery
          cargo test -p archon-control --test persist
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout 3e52dd410e03c5b3cf765969b9b86dcc557a07ba -- .github/workflows/ci.yml
          rm .github/scripts/fix_claimability_reconcile.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(node): keep upgrade provider reconciliation authoritative"
          git push origin HEAD:tmp/claimability-semantic-review
