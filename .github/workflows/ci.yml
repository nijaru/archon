name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'feat/normalized-host-topology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalized-host-topology
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply normalized topology patch
        run: |
          python3 .github/scripts/normalized_host_topology.py
          cargo fmt --all
      - name: Targeted node tests
        run: |
          cargo test -p archon-node discover::tests
          cargo test -p archon-node --test devices
          cargo test -p archon-node --test hetero
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/normalized_host_topology.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(node): carry normalized host topology"
          git push origin HEAD:feat/normalized-host-topology
