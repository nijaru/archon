name: CI

on:
  push:
    branches: [tmp/explicit-resource-claimability]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/explicit-resource-claimability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply claimability patch
        run: |
          python3 .github/scripts/explicit_claimability.py
          python3 .github/scripts/fix_kernel_claimability_fixtures.py
          cargo fmt --all
      - name: Targeted claimability tests
        run: |
          cargo test -p archon-kernel --test claimability
          cargo test -p archon-kernel --test admit
          cargo test -p archon-node --test claimability
          cargo test -p archon-node --test execution_capabilities
          cargo test -p archon-node --test devices
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout d6e51964327c161e52c77486be9470390cc7312a -- .github/workflows/ci.yml
          rm .github/scripts/explicit_claimability.py
          rm .github/scripts/fix_kernel_claimability_fixtures.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(kernel): make resource claimability explicit"
          git push origin HEAD:tmp/explicit-resource-claimability
