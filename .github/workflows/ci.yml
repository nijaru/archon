name: CI

on:
  push:
    branches: [tmp/health-observation-split]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: python .github/scripts/separate_health_observations.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test -p archon-kernel --test select
      - run: cargo test -p archon-kernel --test harden
      - run: cargo test -p archon-control --test persist
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p archon-sim
      - run: cargo deny check advisories bans licenses sources
      - name: Publish validated source-only tree
        run: |
          git checkout HEAD^ -- .github/workflows/ci.yml
          rm .github/scripts/separate_health_observations.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(kernel): separate health observations from resource facts"
          git push
