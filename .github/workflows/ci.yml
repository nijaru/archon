name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admission-ceilings
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply admission documentation cleanup
        run: |
          python3 .github/scripts/finalize_admission_docs.py
          cargo fmt --all
      - name: Verify removed terminology
        run: |
          if grep -R -n -E 'fair[-_]share|admit_fair' crates --include='*.rs'; then
            echo 'removed admission terminology remains' >&2
            exit 1
          fi
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/finalize_admission_docs.py
          git add -A
          if git diff --cached --quiet; then
            echo "no source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(kernel): describe admission budgets accurately"
          git push origin HEAD:refactor/admission-ceilings
