name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p archon-sim

  privileged-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native cgroup enforcement test
        run: cargo test -p archon-node --test cgroup_linux --no-run
      - name: Prove native cgroup and device enforcement
        env:
          ARCHON_REQUIRE_PRIVILEGED_CGROUP: "1"
        run: |
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -perm -111 -name 'cgroup_linux-*' | head -n 1)"
          test -n "$test_bin"
          sudo --preserve-env=ARCHON_REQUIRE_PRIVILEGED_CGROUP env ARCHON_LOG_DIR="$RUNNER_TEMP/archon-privileged-logs" "$test_bin" --nocapture
      - name: Prove queued admission after native agent recovery
        env:
          ARCHON_REQUIRE_PRIVILEGED_CGROUP: "1"
        run: |
          set -o pipefail
          test_bin="$(cargo test -p archon-cli --test native_recovery --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "native_recovery") | .executable')"
          test -x "$test_bin"
          sudo --preserve-env=ARCHON_REQUIRE_PRIVILEGED_CGROUP "$test_bin" --nocapture
      - name: Prove queued admission after Docker agent recovery
        env:
          ARCHON_TEST_DOCKER_IMAGE: busybox:1.37.0
        run: |
          docker pull "$ARCHON_TEST_DOCKER_IMAGE"
          cargo test -p archon-cli --test native_recovery queued_work_waits_for_exact_docker_agent_recovery -- --nocapture

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources
