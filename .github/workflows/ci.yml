name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'fix/provider-endpoint-fencing-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-endpoint-fencing-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply provider endpoint fencing patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/provider_endpoint_fencing.py')
          text = path.read_text()
          fragile = '''if text.count(old) != 1:\n    raise RuntimeError("open_enforced_bindings changed")\ntext = text.replace(old, new, 1)\n'''
          structural = '''func_start = text.index("    fn open_enforced_bindings")\nbody_start = text.index("        for claim in claims {", func_start)\nbody_end = text.index("        Ok(())", body_start)\ntext = text[:body_start] + new + text[body_end:]\n'''
          if text.count(fragile) != 1:
              raise RuntimeError('endpoint staging anchor changed')
          path.write_text(text.replace(fragile, structural, 1))
          PY
          python3 .github/scripts/provider_endpoint_fencing.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          needle = "Command::OpenBinding {"
          for path in Path("crates").rglob("*.rs"):
              text = path.read_text()
              pos = 0
              changed = False
              while True:
                  start = text.find(needle, pos)
                  if start < 0:
                      break
                  brace = text.find("{", start)
                  depth = 0
                  end = None
                  for index in range(brace, len(text)):
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                          if depth == 0:
                              end = index
                              break
                  if end is None:
                      raise RuntimeError(f"unterminated OpenBinding in {path}")
                  block = text[start:end + 1]
                  has_scope = re.search(r"(?m)^\s*scope(?:\s*:|\s*,)", block)
                  if not has_scope and "provider:" in block:
                      line_start = text.rfind("\n", 0, end) + 1
                      close_indent = text[line_start:end]
                      field_indent = close_indent + "    "
                      insertion = field_indent + "scope: archon_kernel::BindingScope::Exclusive,\n"
                      text = text[:line_start] + insertion + text[line_start:]
                      end += len(insertion)
                      changed = True
                  pos = end + 1
              if changed:
                  path.write_text(text)

          path = Path("crates/node/tests/remote.rs")
          text = path.read_text()
          pattern = re.compile(r"(?P<prefix>\s*binding:\s*\d+,\n\s*lease:\s*\d+,\n)(?P<indent>\s*)session:")
          def expand(match):
              indent = match.group("indent")
              return (match.group("prefix") + indent + "node: 1,\n" + indent + "provider: 1,\n" + indent + "scope: archon_kernel::BindingScope::Exclusive,\n" + indent + "session:")
          text, count = pattern.subn(expand, text)
          if count != 2:
              raise RuntimeError(f"expected two legacy Prepare fixtures, updated {count}")
          text = text.replace("        fence: 1,\n    });", "        fence: 1,\n        epoch: 1,\n    });")
          path.write_text(text)

          path = Path("crates/node/src/agent.rs")
          text = path.read_text()
          old = '''        let key = Self::endpoint_key(scope, binding, provider, node);
        let create = matches!(op, EndpointOp::Prepare | EndpointOp::Release | EndpointOp::Fence);
        if create {
            self.endpoints.entry(key).or_insert_with(|| {
                Endpoint::new(
                    ProviderId::from_u64(provider),
                    NodeId::from_u64(node),
                    session,
                )
            });
        }
        let endpoint = self
            .endpoints
            .get_mut(&key)
            .ok_or_else(|| "binding endpoint has not been prepared".to_string())?;
        endpoint.handshake(session);
        endpoint
            .apply(op, BindingId::from_u64(binding), fence, session)
            .map_err(|err| format!("provider endpoint rejected generation: {err:?}"))
'''
          new = '''        let key = Self::endpoint_key(scope, binding, provider, node);
        let adopt_on_activate = matches!(op, EndpointOp::Activate) && !self.endpoints.contains_key(&key);
        let create = adopt_on_activate
            || matches!(op, EndpointOp::Prepare | EndpointOp::Release | EndpointOp::Fence);
        if create {
            self.endpoints.entry(key).or_insert_with(|| {
                Endpoint::new(
                    ProviderId::from_u64(provider),
                    NodeId::from_u64(node),
                    session,
                )
            });
        }
        let endpoint = self
            .endpoints
            .get_mut(&key)
            .ok_or_else(|| "binding endpoint has not been prepared".to_string())?;
        endpoint.handshake(session);
        if adopt_on_activate {
            endpoint
                .apply(
                    EndpointOp::Prepare,
                    BindingId::from_u64(binding),
                    fence,
                    session,
                )
                .map_err(|err| format!("provider endpoint rejected adoption: {err:?}"))?;
        }
        endpoint
            .apply(op, BindingId::from_u64(binding), fence, session)
            .map_err(|err| format!("provider endpoint rejected generation: {err:?}"))
'''
          if text.count(old) != 1:
              raise RuntimeError("endpoint adoption anchor changed")
          text = text.replace(old, new, 1)
          anchor = '''    #[test]
    fn stale_cluster_epoch_is_rejected_by_the_real_agent_path() {
'''
          test = '''    #[test]
    fn fresh_agent_session_can_adopt_current_active_generation() {
        let mut agent = LeaseAgent::new(ProcessRuntime::new());
        assert!(
            apply(
                &mut agent,
                EndpointOp::Activate,
                10,
                BindingScope::Exclusive,
                4,
                7,
            )
            .is_ok(),
            "a fresh agent process must adopt the current generation during reconcile"
        );
        apply(
            &mut agent,
            EndpointOp::Fence,
            10,
            BindingScope::Exclusive,
            4,
            7,
        )
        .unwrap();
        assert!(
            apply(
                &mut agent,
                EndpointOp::Activate,
                10,
                BindingScope::Exclusive,
                4,
                7,
            )
            .is_err(),
            "adoption must not reopen a generation already closed in this process"
        );
    }

'''
          if text.count(anchor) != 1:
              raise RuntimeError("endpoint test anchor changed")
          path.write_text(text.replace(anchor, test + anchor, 1))
          PY
          cargo fmt --all
      - name: Targeted authority tests
        run: |
          cargo test -p archon-kernel --test harden independent_share_bindings_can_coexist_but_exclusive_scope_cannot_mix
          cargo test -p archon-node endpoint_tests
          cargo test -p archon-node --test multi agent_re_registration_reconciles_live_work
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/provider_endpoint_fencing.py
          rm -f .github/provider-endpoint-validation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(node): enforce provider endpoint generations"
          git push origin HEAD:fix/provider-endpoint-fencing-v2
