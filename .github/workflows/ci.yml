name: CI

on:
  push:
    branches: [tmp/fact-writer-ownership]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: python .github/scripts/add_fact_writer_ownership.py
      - run: python .github/scripts/fix_fact_writer_integration.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test -p archon-kernel --test fact_writers
      - run: cargo test -p archon-node --test claimability
      - run: cargo test -p archon-node --test devices
      - run: cargo test -p archon-control --test persist
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p archon-sim
      - run: cargo deny check advisories bans licenses sources
      - name: Publish validated source-only tree
        run: |
          git checkout ecf790a54e1d4fdfc39291c0bc1416c8b6382858 -- .github/workflows/ci.yml
          rm .github/scripts/add_fact_writer_ownership.py
          rm .github/scripts/fix_fact_writer_integration.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(kernel): make discovery fact writers explicit"
          git push
