name: CI

on:
  push:
    branches: [tmp/runtime-placement-exclusions]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/runtime-placement-exclusions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply runtime placement patch
        run: |
          python3 .github/scripts/runtime_placement_exclusions.py
          cargo fmt --all
      - name: Targeted placement tests
        run: |
          cargo test -p archon-kernel --test admit
          cargo test -p archon-node --test execution_placement
      - name: Workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run -p archon-sim
          cargo deny check advisories bans licenses sources
      - name: Commit verified source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/runtime_placement_exclusions.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(node): exclude unenforceable host placement"
          git push origin HEAD:tmp/runtime-placement-exclusions
