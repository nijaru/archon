name: Workload split audit
on:
  push:
    branches: [tmp/workload-intent-split]
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find workload-only Request fields
        shell: bash
        run: |
          set -euxo pipefail
          grep -RInE 'class: RequestClass::Service|command:|image:|storage:|ports:|keep_alive: true|grace_secs: [1-9]' crates --include='*.rs' || true
