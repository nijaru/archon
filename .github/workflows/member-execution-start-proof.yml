name: Member execution start separation
on:
  push:
    branches: [tmp/member-execution-start]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply controller split
        run: python3 .github/scripts/apply_member_execution_start.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Focused activation proof
        run: cargo test -p archon-node --test distributed_activation
      - name: Node tests
        run: cargo test -p archon-node
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Simulator
        run: cargo run -p archon-sim
      - name: Supply chain
        run: cargo deny check advisories bans licenses sources
      - name: Publish validated source tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/member-execution-start-proof.yml .github/scripts/apply_member_execution_start.py
          git add -A
          git config user.name Nick
          git config user.email nijaru7@gmail.com
          git commit -m 'refactor(node): separate member execution start from binding activation'
          git push origin HEAD:tmp/member-execution-start
