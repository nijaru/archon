name: Structured placement explanations

on:
  push:
    branches:
      - tmp/structured-placement-explanations-validation2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Fix temporary patcher multiplicity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_structured_explanations.py')
          text = path.read_text()
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    expected = 2 if label == "greedy machine allocation call" else 1\n    if count != expected:\n        raise SystemExit(f"{label}: expected exactly {expected} match(es), found {count}")\n    return text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit('replace_once helper changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply structured explanation patch
        run: python3 .github/scripts/patch_structured_explanations.py
      - name: Migrate direct Allocation test constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = 0
          for path in Path('crates').rglob('*.rs'):
              text = path.read_text()
              count = text.count('explanation: String::new(),')
              if count:
                  text = text.replace(
                      'explanation: String::new(),',
                      'explanation: String::new().into(),',
                  )
                  path.write_text(text)
                  matches += count
          if matches != 1:
              raise SystemExit(f'expected one direct String::new Allocation explanation, found {matches}')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Targeted placement tests
        run: |
          cargo test -p archon-kernel --test select
          cargo test -p archon-node --test placement_explanations
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Simulator
        run: cargo run -p archon-sim
      - name: Supply chain
        run: cargo deny check advisories bans licenses sources
      - name: Publish validated source tree
        run: |
          rm .github/scripts/patch_structured_explanations.py
          rm .github/workflows/structured-placement-explanations.yml
          git add -A
          git config user.name "Nick"
          git config user.email "nijaru7@gmail.com"
          git commit -m "feat(kernel): add structured placement explanations"
          git push origin HEAD:tmp/structured-placement-explanations-validation2
