name: Recovery events

on:
  push:
    branches:
      - tmp/recovery-events

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Apply recovery event patch
        run: python3 .github/scripts/patch_recovery_events.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test -p archon-node --test distributed_completion -- --nocapture
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p archon-sim
      - run: cargo deny check advisories bans licenses sources
      - name: Publish validated source tree
        run: |
          rm .github/scripts/patch_recovery_events.py
          rm .github/workflows/recovery-events.yml
          git add -A
          git config user.name "Nick"
          git config user.email "nijaru7@gmail.com"
          git commit -m "feat(node): add typed recovery events"
          git push origin HEAD:tmp/recovery-events
